<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc"><title id="title">凭证的签发、持有与验证</title><desc id="desc">签发者把凭证交给持有者，持有者向验证者出示凭证或证明。验证者还需检查信任、状态和业务规则。</desc><rect width="960" height="310" rx="20" fill="#f1f5f9"/><g font-family="sans-serif" text-anchor="middle" fill="#0f172a"><text x="480" y="45" font-size="24" font-weight="bold">凭证流转：把不同职责分开</text><g fill="#fff" stroke="#64748b" stroke-width="2"><rect x="30" y="92" width="230" height="115" rx="12"/><rect x="365" y="92" width="230" height="115" rx="12"/><rect x="700" y="92" width="230" height="115" rx="12"/></g><text x="145" y="130" font-size="24">签发者 Issuer</text><text x="145" y="169" font-size="18">作出声明并提供证明</text><text x="480" y="130" font-size="24">持有者 Holder</text><text x="480" y="169" font-size="18">保管凭证，选择出示</text><text x="815" y="130" font-size="24">验证者 Verifier</text><text x="815" y="169" font-size="18">验证证明并决定权限</text><g stroke="#2563eb" stroke-width="3" fill="none"><path d="M270 153h83m-10-8 10 8-10 8"/><path d="M605 153h83m-10-8 10 8-10 8"/></g><text x="313" y="130" font-size="16">签发</text><text x="646" y="130" font-size="16">出示</text><text x="480" y="251" font-size="19">签名有效 ≠ 声明必然真实 ≠ 自动获得业务权限</text><text x="480" y="284" font-size="15" fill="#475569">学习笔记自绘示意图；凭证主体不一定等于持有者</text></g></svg>